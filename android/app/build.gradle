plugins { id 'com.android.application' }
android {
  namespace 'tw.kaohsiungdrive.app'
  compileSdk 34
  defaultConfig { applicationId 'tw.kaohsiungdrive.app'; minSdk 24; targetSdk 34; versionCode 1; versionName '0.9' }
  signingConfigs { debug { storeFile file('../debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
  buildTypes { debug { signingConfig signingConfigs.debug }; release { signingConfig signingConfigs.debug; minifyEnabled false } }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
