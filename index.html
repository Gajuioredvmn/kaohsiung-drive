:root{

  --panel:rgba(18,12,42,.72);

  --sea:#3fd0d4;         /* secondary accent */
  --lime:#b6f26a;        /* go */
  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-num:"Russo One","Noto Sans TC",system-ui,sans-serif;
  --font-pix:"Press Start 2P","Noto Sans TC",monospace;
  --sl:max(16px, env(safe-area-inset-left, 0px));
  --sr:max(16px, env(safe-area-inset-right, 0px));
  --st:env(safe-area-inset-top, 0px);
  --sb:env(safe-area-inset-bottom, 0px);
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--night);color:var(--cream);overflow:hidden;overscroll-behavior:none;
  font-family:var(--font-ui);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{padding:0}
canvas#gl,canvas#hud{position:fixed;inset:0;width:100%;height:100%;display:block}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
canvas#hud{pointer-events:none;z-index:3}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:2px solid var(--sun);outline-offset:3px}
#fatal{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font-size:18px;background:var(--night);z-index:99}

/* ---------- screens ---------- */
#ui{position:fixed;inset:0;z-index:5;pointer-events:none}
#ui .scr{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:auto;
  padding:max(10px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#s-title{background:radial-gradient(ellipse at 50% 42%,rgba(10,6,24,.62),rgba(10,6,24,.18) 58%,rgba(10,6,24,0) 75%)}
#ui .scr.dim{background:radial-gradient(ellipse at 50% 40%,rgba(18,12,42,.35),rgba(10,6,24,.82))}
.panel{background:linear-gradient(180deg,rgba(28,16,64,.93),rgba(12,8,30,.95));border:2px solid var(--sun);border-radius:14px;
  box-shadow:0 0 0 3px rgba(10,6,24,.85),0 14px 40px rgba(0,0,0,.55);color:var(--cream)}
.btn{font:900 clamp(15px,2.4vh,19px)/1 var(--font-ui);color:var(--night);background:linear-gradient(180deg,#ffe08a,var(--sun));border-radius:10px;
  padding:.62em 1.2em;box-shadow:0 4px 0 #9a5a10,0 6px 14px rgba(0,0,0,.4);letter-spacing:.06em;transform:skewX(-6deg);transition:transform .08s,filter .08s}
.btn:hover{filter:brightness(1.08)} .btn:active{transform:skewX(-6deg) translateY(3px);box-shadow:0 1px 0 #9a5a10}
.btn.big{font-size:clamp(18px,3.4vh,26px);padding:.6em 1.5em;background:linear-gradient(180deg,#ff9a6a,var(--hot));color:#fff;box-shadow:0 4px 0 #8a1a3a,0 8px 18px rgba(0,0,0,.45);text-shadow:0 2px 0 #8a1a3a}
.btn.ghost{background:rgba(255,243,220,.08);color:var(--cream);box-shadow:inset 0 0 0 2px rgba(255,243,220,.35)}
.btn.sea{background:linear-gradient(180deg,#8af0f2,var(--sea));box-shadow:0 4px 0 #1a6a7a,0 6px 14px rgba(0,0,0,.4)}
.btn[aria-pressed="true"]{background:linear-gradient(180deg,#b6ffd0,var(--lime));box-shadow:0 4px 0 #3a7a2a,0 0 0 3px #fff3dc}
.pix{font-family:var(--font-pix);letter-spacing:.08em}
h2.ttl{margin:0 0 .5em;font:900 clamp(18px,3.2vh,26px)/1.1 var(--font-ui);color:var(--sun);letter-spacing:.08em;transform:skewX(-8deg);text-shadow:0 3px 0 #140c2a}
/* title */
.title-wrap{display:flex;flex-direction:column;align-items:center;gap:clamp(8px,2.4vh,22px);text-align:center}
.logo{display:flex;flex-direction:column;align-items:center;transform:skewX(-10deg)}
.logo-tc{font:900 clamp(46px,15vh,112px)/1 var(--font-ui);letter-spacing:.04em;color:#ffd23a;
  text-shadow:-2px -2px 0 #1a0c30,2px -2px 0 #1a0c30,-2px 2px 0 #1a0c30,2px 2px 0 #1a0c30,0 4px 0 #ff6a2a,0 6px 0 #ff3a7a,0 8px 0 #c01a5a,0 10px 0 #1a0c30,0 0 30px rgba(255,140,60,.55)}
.logo-en{font:400 clamp(20px,6vh,46px)/1 var(--font-num);letter-spacing:.32em;margin-top:.22em;color:#e8f6ff;
  text-shadow:-1px -1px 0 #10183a,1px -1px 0 #10183a,-1px 1px 0 #10183a,1px 1px 0 #10183a,0 3px 0 #3a6ad8,0 5px 0 #10183a}
.logo-yr{font:700 clamp(11px,2.2vh,15px)/1 var(--font-ui);color:var(--cream);letter-spacing:.3em;margin-top:.9em;text-shadow:0 2px 0 #140c2a,0 0 6px #140c2a}
.tap{font:400 clamp(12px,2.4vh,16px)/1 var(--font-pix);color:#fff;text-shadow:0 2px 0 #140c2a;animation:blink 1s steps(2,end) infinite}
@keyframes blink{50%{opacity:0}}
.menu{display:flex;flex-direction:column;gap:clamp(8px,1.6vh,12px);align-items:stretch;min-width:min(260px,70vw)}
.foot{position:absolute;bottom:max(8px,env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font:500 11px var(--font-ui);color:rgba(255,243,220,.7)}
/* car select */
.sel{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;gap:clamp(6px,1.6vh,14px);width:min(1100px,100%);height:min(640px,100%)}
.show{position:relative;display:flex;align-items:center;justify-content:center;min-height:0;border-radius:14px;
  background:radial-gradient(ellipse at 50% 78%,rgba(255,210,58,.28),rgba(255,210,58,0) 55%),linear-gradient(180deg,rgba(40,24,90,.55),rgba(14,8,32,.75));border:2px solid rgba(255,243,220,.18)}
.show canvas{width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
.show .arrow{position:absolute;top:50%;transform:translateY(-50%);font:900 26px var(--font-num);color:var(--sun);width:48px;height:64px;border-radius:10px;background:rgba(10,6,24,.55)}
.show .arrow.l{left:6px} .show .arrow.r{right:6px}
.badge{position:absolute;top:10px;left:12px;display:flex;gap:6px}
.badge span{font:400 11px var(--font-pix);padding:6px 8px;border-radius:6px;background:rgba(10,6,24,.75);color:var(--sea);border:1px solid rgba(63,208,212,.6)}
.badge span.g6{color:var(--sun);border-color:rgba(255,178,62,.7)}
.info{padding:clamp(10px,2vh,18px) clamp(12px,2vw,20px);display:flex;flex-direction:column;gap:clamp(5px,1.1vh,10px);min-height:0;overflow:auto}
.nm b{display:block;font:900 clamp(24px,5.4vh,40px)/1 var(--font-ui);color:#fff;transform:skewX(-8deg);text-shadow:0 3px 0 #140c2a}
.nm span{font:400 clamp(11px,1.8vh,13px)/1 var(--font-pix);color:var(--sun);letter-spacing:.14em}
.desc{margin:0;font:500 clamp(12px,2vh,15px)/1.5 var(--font-ui);color:var(--cream)}
.crew{font:700 clamp(11px,1.8vh,13px)/1.4 var(--font-ui);color:var(--sea)}
.stats{display:grid;grid-template-columns:auto 1fr auto;gap:5px 10px;align-items:center}
.stats .l{font:700 clamp(11px,1.8vh,13px)/1 var(--font-ui);color:var(--cream)}
.stats .v{font:400 10px var(--font-pix);color:#fff}
.bar{height:clamp(8px,1.4vh,11px);border-radius:3px;background:rgba(255,243,220,.12);overflow:hidden}
.bar i{transition:width .5s cubic-bezier(.2,.8,.2,1);display:block;height:100%;background:linear-gradient(90deg,var(--sea),var(--lime),var(--sun),var(--hot));background-size:200px 100%}
.thumbs{grid-column:1/2;display:flex;gap:6px;overflow-x:auto;align-items:center;padding:2px}
.thumbs button{flex:0 0 auto;width:clamp(56px,9vw,82px);aspect-ratio:2/1;border-radius:8px;background:rgba(10,6,24,.6);border:2px solid transparent;padding:0}
.thumbs button[aria-current="true"]{border-color:var(--sun);background:rgba(255,178,62,.18)}
.thumbs canvas{width:100%;height:100%;image-rendering:pixelated;object-fit:contain}
.sel .actions{grid-column:2/3;display:flex;gap:10px;justify-content:flex-end;align-items:center}
/* setup, pause, results, records, settings */
.card{padding:clamp(12px,2.6vh,24px) clamp(14px,3vw,30px);width:min(720px,100%);max-height:100%;overflow:auto}
.row{display:grid;grid-template-columns:clamp(64px,10vw,96px) 1fr;gap:10px;align-items:center;margin:0 0 clamp(8px,1.8vh,14px)}
.row .lbl{font:900 clamp(13px,2.2vh,16px)/1 var(--font-ui);color:var(--sun)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg .btn{font-size:clamp(13px,2.2vh,16px);padding:.55em .9em}
.avrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.avrow canvas{width:56px;height:56px;image-rendering:pixelated;border-radius:50%}
.btn.file{position:relative;overflow:hidden;cursor:pointer} .btn.file input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.txt{font:700 clamp(14px,2.2vh,17px)/1.2 var(--font-ui);color:var(--cream);background:rgba(0,0,0,.35);border:2px solid rgba(255,243,220,.35);border-radius:8px;padding:.45em .7em;width:9em;max-width:100%}
.av{display:inline-flex;flex:0 0 auto;border-radius:50%;overflow:hidden;background:#5a6a9a;border:2px solid #fff6e0;box-shadow:0 0 0 2px #140a1a} .av img{display:block;object-fit:cover}
.txt.code{width:7em;letter-spacing:.2em;text-transform:uppercase;font-family:var(--font-num)}
.code{font:400 clamp(12px,2vh,15px) var(--font-pix);color:var(--sun);letter-spacing:.15em}
.players{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:6px} .pl{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:10px;background:rgba(0,0,0,.3);font:700 clamp(13px,2.2vh,16px)/1.2 var(--font-ui);color:var(--cream)}
.pl.me{box-shadow:inset 0 0 0 2px rgba(255,178,62,.6)} .pl .car{opacity:.75;font-weight:500} .pl .tag{margin-left:auto;font:400 10px var(--font-pix);color:var(--sea)} .pl .tag.fin{color:var(--sun)} .pl .t{margin-left:auto;font-family:var(--font-num)}

.radio button{text-align:left;padding:.5em .8em;border-radius:10px;background:rgba(255,243,220,.06);color:var(--cream);border:2px solid rgba(255,243,220,.18);font:900 clamp(13px,2.2vh,16px)/1.25 var(--font-ui)}
.radio button small{display:block;font:400 9px var(--font-pix);color:var(--sea);margin-top:3px;letter-spacing:.08em}
.radio button[aria-pressed="true"]{border-color:var(--lime);background:rgba(124,242,106,.14)}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
.vmenu{display:flex;flex-direction:column;gap:10px;align-items:stretch;min-width:min(280px,80vw);padding:22px}
.res-banner{font:400 clamp(30px,8vh,64px)/1 var(--font-num);text-align:center;transform:skewX(-10deg);letter-spacing:.08em;margin:0 0 .2em;filter:drop-shadow(0 4px 0 #140c2a)}
.unused-res-body{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:center;justify-content:center}.res-body>table.sp{flex:1 1 260px;min-width:0}
.cmap-box{flex:1 1 250px;max-width:400px;margin:0 auto}.cmap{display:block;width:100%;height:auto;font-family:var(--font-ui)}
.unl{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:4px 8px;font:700 clamp(12px,2vh,14px)/1.3 var(--font-ui)}.unl li{padding:2px 8px;border-radius:8px;background:rgba(255,243,220,.12)}.unl li.lock{opacity:.45}.unl li small{margin-left:4px;font-weight:500}

.hand{display:flex;gap:8px;justify-content:center;flex-wrap:nowrap}.cardb{flex:1 1 0;max-width:230px;min-width:0;min-height:0;display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;padding:12px 14px;border-radius:12px;border:2px solid var(--sun);background:linear-gradient(180deg,rgba(40,24,90,.95),rgba(16,10,40,.95));color:var(--cream);font:700 clamp(13px,2.2vh,16px)/1.3 var(--font-ui);cursor:pointer}.cardb .k{font-size:.75em;letter-spacing:.1em;opacity:.8}.cardb b{font-size:1.25em;color:#fff}.cardb .d{font-weight:500;font-size:.85em;opacity:.9}.cardb.drive{border-color:#7ec8ff}.cardb.item{border-color:#ffd23a;background:linear-gradient(180deg,rgba(90,60,20,.95),rgba(30,18,6,.95))}.cardb.risk{border-color:#ff8aa0}.cardb.road{border-color:#7cf26a}.cardb:active{transform:scale(.97)}
.res-sub{text-align:center;font:700 clamp(13px,2.2vh,16px)/1.4 var(--font-ui);color:var(--cream);margin:0 0 .8em}
table.sp{width:100%;border-collapse:collapse;font:700 clamp(12px,2vh,15px)/1.5 var(--font-ui)}
table.sp td{padding:3px 6px;border-bottom:1px solid rgba(255,243,220,.12)}
table.sp td.t{text-align:right;font-family:var(--font-num);color:#fff;white-space:nowrap}
.via{font-size:.78em;font-weight:400;opacity:.72;line-height:1.3}
.new{color:var(--lime);font:400 11px var(--font-pix);margin-left:8px;animation:blink .6s steps(2,end) infinite}
.rng{width:100%;accent-color:var(--sun)}
@media (max-height:430px){.sel{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}.desc{display:none}.thumbs button{width:52px}}
@media (orientation:portrait){.sel{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto auto auto}.sel .actions,.thumbs{grid-column:1}}
#rot{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:var(--night);color:var(--cream);font:900 20px var(--font-ui);text-align:center;padding:24px}
@media (orientation:portrait) and (pointer:coarse){#rot.need{display:flex}}
</style>

  if (CAR.slipK > 1.05 && Math.abs(CAR.vx) > 3 && Math.random() < 0.6) { r3AddMark(CAR.x - Math.sin(CAR.yaw) * CAR.P.b, CAR.z - Math.cos(CAR.yaw) * CAR.P.b, CAR.yaw, 1); r3AddMark(CAR.x - Math.sin(CAR.yaw) * CAR.P.b, CAR.z - Math.cos(CAR.yaw) * CAR.P.b, CAR.yaw, -1); }
  camUpdate(dt);
  engineUpdate(CAR.rpm, CAR.P.red, CAR.throttle, Math.abs(CAR.vx), clamp(CAR.slipK - 0.9, 0, 1), CAR.surface !== GK.asphalt && CAR.surface !== GK.concrete ? 1 : 0, false, CAR.hand > 0.5 && Math.abs(CAR.vx) > 5);

function onCarHit(into) { CAMV.shake = Math.min(1, into / 10); if (into > 2.5) sfxCrash(clamp(into / 20, 0.3, 1)); else sfxThud(0.5); }
function render(dt) {
  if (G.mode === 'drive') { r3Update(CAMV.az); r3Frame(CAMV.fp ? 24 : 10); drawHud(); }
}
// ---------- the HUD: speed, gear, revs, the minimap, the pads ----------
function otext(str, x, y, size, fill, font, align, stroke, lw) { hud.font = (font && font.weight ? font.weight : '700') + ' ' + size + 'px ' + (font && font.family ? font.family : '"Russo One","Noto Sans TC",sans-serif'); hud.textAlign = align || 'left'; hud.textBaseline = 'alphabetic'; hud.lineJoin = 'round'; hud.lineWidth = lw || Math.max(2, size * 0.14); hud.strokeStyle = stroke || '#140c2a'; hud.strokeText(str, x, y); hud.fillStyle = fill; hud.fillText(str, x, y); }
function rrect(x, y, w, h, r) { hud.beginPath(); hud.moveTo(x + r, y); hud.arcTo(x + w, y, x + w, y + h, r); hud.arcTo(x + w, y + h, x, y + h, r); hud.arcTo(x, y + h, x, y, r); hud.arcTo(x, y, x + w, y, r); hud.closePath(); }
function pad(r, label, on) { if (!r) return; hud.fillStyle = on ? 'rgba(255,210,58,.35)' : 'rgba(10,16,40,.45)'; rrect(r.x, r.y, r.w, r.h, 12); hud.fill(); hud.strokeStyle = 'rgba(255,243,220,.5)'; hud.lineWidth = 1.5; hud.stroke(); otext(label, r.x + r.w / 2, r.y + r.h / 2 + 6, 15, '#fff3dc', { family: '"Noto Sans TC",sans-serif' }, 'center', '#0a1028', 2); }
function drawHud() {
  const W = innerWidth, H = innerHeight, C = CAR; hud.clearRect(0, 0, W, H);
  if (!HUD.show) return;
  // speed and gear, bottom centre-right
  otext(String(Math.round(C.kmh)), W * 0.5 + 60, H - 28, 44, '#ffffff', null, 'right', '#0a1028', 4); otext('km/h', W * 0.5 + 66, H - 28, 14, '#ffd23a', null, 'left', '#0a1028', 2);
  otext((C.auto ? 'AT ' : 'MT ') + C.gear, W * 0.5 - 70, H - 28, 22, '#9ad0ff', null, 'right', '#0a1028', 3);
  // the rev bar
  const r = clamp(C.rpm / C.P.red, 0, 1.05), bx = W * 0.5 - 70, by = H - 18, bw = 136; hud.fillStyle = 'rgba(0,0,0,.4)'; hud.fillRect(bx, by, bw, 6); hud.fillStyle = r > 0.92 ? '#ff4f6d' : '#7cf26a'; hud.fillRect(bx, by, bw * Math.min(1, r), 6);
  // what the tyres are doing
  if (C.slipK > 1.05) otext(C.hand > 0.5 ? '手煞車' : C.slipR > C.slipF ? '甩尾' : '推頭', W * 0.5, H - 70, 16, '#ffd23a', { family: '"Noto Sans TC",sans-serif' }, 'center', '#0a1028', 2);
  // the place and the fps, top left
  otext(MAP.name, 14, 30, 18, '#fff3dc', { family: '"Noto Sans TC",sans-serif' }, 'left', '#0a1028', 3);
  otext(G.fps + ' fps', 14, 50, 11, 'rgba(255,243,220,.7)', null, 'left', '#0a1028', 2);
  // the minimap, bottom left
  const ms = Math.min(150, H * 0.32), mx = 14, my = H - ms - 14; hud.save(); rrect(mx, my, ms, ms, 10); hud.clip(); hud.globalAlpha = 0.85; hud.drawImage(HUD.minimap, mx, my, ms, ms); hud.globalAlpha = 1;
  const k = ms / MAP.W, cx = mx + C.x * k, cz = my + C.z * k; hud.fillStyle = '#ff4f6d'; hud.beginPath(); hud.arc(cx, cz, 4, 0, TAU); hud.fill(); hud.strokeStyle = '#fff'; hud.lineWidth = 1.5; hud.beginPath(); hud.moveTo(cx, cz); hud.lineTo(cx + Math.sin(C.yaw) * 10, cz + Math.cos(C.yaw) * 10); hud.stroke(); hud.restore();
  // messages
  let y = H * 0.3; for (const m of HUD.msgs) { hud.globalAlpha = m.t < 0.15 ? m.t / 0.15 : m.t > m.dur - 0.3 ? (m.dur - m.t) / 0.3 : 1; otext(m.text, W / 2, y, 30, m.col, { family: '"Noto Sans TC",sans-serif' }, 'center', '#0a1028', 4); if (m.sub) otext(m.sub, W / 2, y + 24, 15, '#fff3dc', { family: '"Noto Sans TC",sans-serif' }, 'center', '#0a1028', 2); hud.globalAlpha = 1; y += 60; }
  // the pads
  if (IS_TOUCH) { const P = CTL.pads, T = [...CTL.touches.values()]; pad(P.gas, '油門', T.some((t) => t.kind === 'gas')); pad(P.brake, '煞車', T.some((t) => t.kind === 'brake')); pad(P.hand, '手煞車', T.some((t) => t.kind === 'hand')); if (!C.auto) { pad(P.up, '▲ 升檔', false); pad(P.dn, '▼ 降檔', false); } if (P.steer) { pad(P.steer, '← 滑動轉向 →', false); } }
  pad(CTL.pads.view, CAMV.fp ? '座艙' : '車後', false); pad(CTL.pads.pause, '∥', false); pad(CTL.pads.horn, '喇叭', false);
  if (CAMV.fp) drawCockpit();
}
// the driver's seat: the dash across the bottom, the wheel turning with the steering, the gauges
function drawCockpit() {
  const W = innerWidth, H = innerHeight, C = CAR, col = cssHex(C.spec.interior || 0x2a2a2a), dh = H * 0.26;
  hud.fillStyle = col; hud.beginPath(); hud.moveTo(0, H); hud.lineTo(0, H - dh * 0.7); hud.quadraticCurveTo(W * 0.5, H - dh * 1.25, W, H - dh * 0.7); hud.lineTo(W, H); hud.closePath(); hud.fill();
  hud.fillStyle = 'rgba(0,0,0,.35)'; hud.fillRect(0, H - dh * 0.72, W, 3);
  // the wheel
  const wx = W * 0.42, wy = H - dh * 0.12, R = Math.min(W, H) * 0.19; hud.save(); hud.translate(wx, wy); hud.rotate(C.steer * 2.6); hud.strokeStyle = '#1a1a1e'; hud.lineWidth = R * 0.16; hud.beginPath(); hud.arc(0, 0, R, 0, TAU); hud.stroke(); hud.lineWidth = R * 0.1; hud.beginPath(); hud.moveTo(-R, 0); hud.lineTo(R, 0); hud.moveTo(0, 0); hud.lineTo(0, R); hud.stroke(); hud.fillStyle = cssHex(C.spec.color); hud.beginPath(); hud.arc(0, 0, R * 0.18, 0, TAU); hud.fill(); hud.restore();
  // gauges
  const gauge = (x, y, r, val, red, label) => { hud.strokeStyle = '#111'; hud.lineWidth = 3; hud.beginPath(); hud.arc(x, y, r, 0, TAU); hud.stroke(); hud.fillStyle = '#0c0c10'; hud.fill(); for (let i = 0; i <= 10; i++) { const a = Math.PI * 0.75 + (i / 10) * Math.PI * 1.5; hud.strokeStyle = i >= red ? '#ff4f6d' : '#ddd'; hud.lineWidth = 2; hud.beginPath(); hud.moveTo(x + Math.cos(a) * r * 0.8, y + Math.sin(a) * r * 0.8); hud.lineTo(x + Math.cos(a) * r * 0.92, y + Math.sin(a) * r * 0.92); hud.stroke(); } const a = Math.PI * 0.75 + clamp(val, 0, 1) * Math.PI * 1.5; hud.strokeStyle = '#ff8a3a'; hud.lineWidth = 3; hud.beginPath(); hud.moveTo(x, y); hud.lineTo(x + Math.cos(a) * r * 0.85, y + Math.sin(a) * r * 0.85); hud.stroke(); otext(label, x, y + r * 0.6, 10, '#aaa', null, 'center', '#000', 1); };
  gauge(W * 0.42 - R * 1.7, H - dh * 0.45, R * 0.45, C.rpm / C.P.red, 9, 'rpm'); gauge(W * 0.42 + R * 1.7, H - dh * 0.45, R * 0.45, C.kmh / 320, 11, 'km/h');
}
// ---------- test hooks ----------
window.__kh = {
  G, CAR, CAMV, CTL, MAP, PROPS, R3, SET, CARS, startDrive, carToRoad, show, carPhysics,
  halt(on) { G.halt = !!on; }, sim(sec, h) { h = h || 1 / 120; const n = Math.round(sec / h); for (let i = 0; i < n; i++) tick(h); return this.state(); },
  step(dt) { tick(dt); render(dt); return $('gl').toDataURL('image/png'); },
  state() { const C = CAR; return { x: +C.x.toFixed(1), z: +C.z.toFixed(1), yaw: +C.yaw.toFixed(2), kmh: Math.round(C.kmh), vy: +C.vy.toFixed(2), r: +C.r.toFixed(2), rpm: Math.round(C.rpm), gear: C.gear, surf: C.surface, slip: +C.slipK.toFixed(2), dmg: +C.damage.toFixed(2), fps: G.fps }; },
};

// ===================== screens: title, the showroom, settings, pause =====================
const UI = { scr: 'title', sel: 0, turnRaf: 0, turnT: 0, unlocked: false };
const STAT_ROWS = [['極速', (c) => c.top / 340, (c) => c.top + ' km/h'], ['加速', (c) => c.acc, null], ['抓地', (c) => c.grip, null], ['操控', (c) => c.steer, null], ['車重', (c) => c.mass, (c) => Math.round(carPhysics(c).m) + ' kg']];
const ENGINE_NAME = { v12: 'V12', v8: 'V8', i6: '直列六缸', i4: '直列四缸', flat6: '水平對臥六缸', turbo: '渦輪增壓' };
const DRIVE_NAME = { rwd: '後輪驅動', fwd: '前輪驅動', awd: '四輪驅動' };
function h(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstChild; }
function uiInit() {
  const root = $('ui');
  root.innerHTML = `
  <section class="scr" id="s-title">
    <div class="title-wrap"><div class="logo"><span class="logo-tc">港都漫遊</span><span class="logo-en">KAOHSIUNG DRIVE</span><span class="logo-yr">高雄・開放世界　HD-2D　第一階段</span></div>
      <div class="tap" id="tap">點一下開始　TAP TO START</div>
      <div class="menu" id="menu" hidden><button class="btn big" data-go="select">選車出發</button><button class="btn" data-go="settings">設定</button></div></div>
    <div class="foot">左右傾斜手機轉向・右手油門煞車・畫面上方左右拖曳轉鏡頭</div>
  </section>
  <section class="scr dim" id="s-select" hidden>
    <div class="sel">
      <div class="show"><canvas id="turn" width="460" height="200"></canvas><div class="badge"><span id="b-gear"></span><span id="b-eng"></span><span id="b-drv"></span></div>
        <button class="arrow l" data-act="prev">◀</button><button class="arrow r" data-act="next">▶</button></div>
      <div class="info panel"><div class="nm"><b id="c-name"></b><span id="c-en"></span></div><p class="desc" id="c-desc"></p><div class="stats" id="c-stats"></div></div>
      <div class="thumbs" id="thumbs"></div>
      <div class="actions"><button class="btn ghost" data-go="title">返回</button><button class="btn big" data-act="go">出發！</button></div>
    </div>
  </section>
  <section class="scr dim" id="s-settings" hidden><div class="panel card" id="settings"></div></section>
  <section class="scr dim" id="s-pause" hidden><div class="panel vmenu"><h2 class="ttl" style="text-align:center">暫停</h2><button class="btn big" data-act="resume">繼續</button><button class="btn" data-act="road">回到路上</button><button class="btn" data-go="settings">設定</button><button class="btn ghost" data-act="title">回標題</button></div></section>`;
  document.body.appendChild(h('<div id="rot" class="need"><div style="font-size:44px">⟲</div>請把手機轉成橫向</div>'));
  root.addEventListener('click', onUiClick);
  $('s-title').addEventListener('pointerdown', unlock);
  show('title');
}
function unlock() { if (UI.unlocked) return; UI.unlocked = true; audioInit(); tiltInit(); $('tap').hidden = true; $('menu').hidden = false; }
function show(name) {
  UI.scr = name;
  for (const s of document.querySelectorAll('#ui .scr')) s.hidden = s.id !== 's-' + name;
  if (name === 'select') openSelect(); else cancelAnimationFrame(UI.turnRaf);
  if (name === 'settings') openSettings();
  $('ui').style.pointerEvents = name ? 'auto' : 'none';
}
function onUiClick(e) {
  const b = e.target.closest('button'); if (!b) return;
  if (!UI.unlocked) unlock();
  sfxUi();
  if (b.dataset.go) { if (b.dataset.go === 'title' && G.mode === 'drive') { G.mode = 'title'; engineStop(); } show(b.dataset.go); return; }
  switch (b.dataset.act) {
    case 'prev': UI.sel = (UI.sel + CARS.length - 1) % CARS.length; openSelect(); break;
    case 'next': UI.sel = (UI.sel + 1) % CARS.length; openSelect(); break;
    case 'go': startDrive(UI.sel); break;
    case 'resume': onPausePressed(); break;
    case 'road': carToRoad(); onPausePressed(); break;
    case 'title': G.mode = 'title'; G.paused = false; engineStop(); show('title'); break;
  }
}
// ---------- the showroom ----------
function openSelect() {
  const c = CARS[UI.sel], P = carPhysics(c);
  $('c-name').textContent = c.name; $('c-en').textContent = c.en; $('c-desc').textContent = c.desc;
  $('b-gear').textContent = c.gears + ' 速'; $('b-eng').textContent = ENGINE_NAME[c.engine] || c.engine; $('b-drv').textContent = DRIVE_NAME[P.drive];
  const st = $('c-stats'); st.innerHTML = '';
  for (const [l, f, v] of STAT_ROWS) { st.appendChild(h(`<span class="l">${l}</span>`)); const b = h('<div class="bar"><i></i></div>'); b.firstChild.style.width = Math.round(clamp(f(c), 0.05, 1) * 100) + '%'; st.appendChild(b); st.appendChild(h(`<span class="v">${v ? v(c) : ''}</span>`)); }
  const th = $('thumbs'); th.innerHTML = ''; CARS.forEach((q, i) => { const d = h(`<button class="th${i === UI.sel ? ' on' : ''}" style="--c:${cssHex(q.color)}"></button>`); d.onclick = () => { UI.sel = i; openSelect(); }; th.appendChild(d); });
  if (!UI.turnRaf) turnLoop();
}
function turnLoop() {
  UI.turnRaf = 0; if (UI.scr !== 'select') return; UI.turnRaf = requestAnimationFrame(turnLoop);
  const spec = CARS[UI.sel], cv = $('turn'), g2 = cv.getContext('2d'); UI.turnT += 1 / 60; const t = UI.turnT;
  g2.imageSmoothingEnabled = false; g2.clearRect(0, 0, cv.width, cv.height);
  const W = cv.width, H = cv.height, fy = H - 30, tx = W / 2, ty = fy + 4;
  g2.fillStyle = 'rgba(10,6,24,.55)'; g2.fillRect(0, fy, W, H - fy);
  g2.fillStyle = 'rgba(40,30,70,.9)'; g2.beginPath(); g2.ellipse(tx, ty, 150, 20, 0, 0, TAU); g2.fill();
  for (let k = 0; k < 24; k++) { const a = (k / 24) * TAU + t * 1.2, lit = (k + Math.floor(t * 6)) % 3 === 0; g2.fillStyle = lit ? '#ffd23a' : '#5a4a8a'; g2.fillRect(Math.round(tx + Math.cos(a) * 150) - 2, Math.round(ty + Math.sin(a) * 20) - 2, 4, 4); }
  const yaw = (t * (TAU / 8) + 0.55) % TAU, fi = Math.round((yaw / TAU) * TURN_N) % TURN_N, img = carTurnFrame(spec, fi);
  const k = 1.45, w = img.width * k, hgt = img.height * k, x = tx - w / 2, y = fy - TURN_OPT.gy * k;
  g2.save(); g2.beginPath(); g2.rect(0, fy, W, H - fy); g2.clip(); g2.globalAlpha = 0.2; g2.translate(0, fy * 2 + 2); g2.scale(1, -1); g2.drawImage(img, x, y, w, hgt); g2.restore();
  g2.fillStyle = 'rgba(0,0,0,.35)'; g2.beginPath(); g2.ellipse(tx, fy + 2, w * 0.3, 6, 0, 0, TAU); g2.fill();
  g2.drawImage(img, x, y, w, hgt);
}
// ---------- settings ----------
function openSettings() {
  $('settings').innerHTML = `<h2 class="ttl">設定</h2>
    <div class="row"><span class="lbl">方向盤</span><div class="seg" id="seg-ctrl"><button class="btn" data-v="tilt">陀螺儀</button><button class="btn" data-v="touch">觸控滑桿</button></div></div>
    <div class="row"><span class="lbl">變速箱</span><div class="seg" id="seg-auto"><button class="btn" data-v="1">AT 自排</button><button class="btn" data-v="0">MT 手排</button></div></div>
    <div class="row"><span class="lbl">畫質</span><div class="seg" id="seg-q"><button class="btn" data-v="high">高（景深、泛光）</button><button class="btn" data-v="low">省電</button><button class="btn" data-v="off">不要後製</button></div></div>
    <div class="row"><span class="lbl">轉向靈敏</span><div><input class="rng" type="range" min="10" max="40" step="1" value="${SET.sens}" id="rng-sens"><div class="note">傾斜 <span id="v-sens">${SET.sens}</span>° 打滿</div></div></div>
    <div class="actions"><button class="btn" data-act="back">完成</button></div>`;
  const mark = () => { for (const [id, key] of [['seg-ctrl', 'ctrl'], ['seg-auto', 'auto'], ['seg-q', 'quality']]) for (const b of document.querySelectorAll('#' + id + ' .btn')) b.setAttribute('aria-pressed', String(b.dataset.v) === String(key === 'auto' ? (SET.auto ? 1 : 0) : SET[key]) ? 'true' : 'false'); };
  mark();
  $('settings').onclick = (e) => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.act === 'back') { show(G.mode === 'drive' ? 'pause' : 'title'); return; } const seg = b.parentElement.id; if (seg === 'seg-ctrl') SET.ctrl = b.dataset.v; if (seg === 'seg-auto') { SET.auto = b.dataset.v === '1'; CAR.auto = SET.auto; } if (seg === 'seg-q') { SET.quality = b.dataset.v; r3Resize(); } saveSettings(); mark(); CTL.mode = SET.ctrl === 'tilt' && CTL.tilt.ok ? 'tilt' : 'touch'; layoutPads(); };
  $('rng-sens').oninput = (e) => { SET.sens = +e.target.value; CTL.sens = SET.sens; $('v-sens').textContent = SET.sens; saveSettings(); };
}

boot();
})();
</script></body></html>
